version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: neonpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: neonpulse_db
      POSTGRES_USER: neonpulse_user
      POSTGRES_PASSWORD: neonpulse_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neonpulse_user -d neonpulse_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
