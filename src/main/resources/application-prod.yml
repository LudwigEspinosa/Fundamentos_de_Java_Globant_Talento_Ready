spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/neonpulse_db}
    username: ${DATABASE_USERNAME:neonpulse_user}
    password: ${DATABASE_PASSWORD:neonpulse_pass}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

# Springdoc OpenAPI & Swagger-UI (Hermetically disabled in production for security compliance)
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
